name: Patch resource lookup resilience
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/resources-lookup-resilience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resources-lookup-resilience
          fetch-depth: 0
      - name: Patch geo resilience
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/geo.ts'); s=p.read_text()
          old='''async function nominatimSearch(q: string, acceptLang: string) {\n  const url = `${NOMINATIM}/search?format=jsonv2&limit=1&addressdetails=1&q=${encodeURIComponent(q)}`;\n  const r = await fetch(url, { headers: { 'User-Agent': UA, 'Accept-Language': acceptLang } });\n  if (!r.ok) return null;\n  const data = (await r.json()) as any[];\n  const hit = data?.[0];\n  if (!hit) return null;\n  return {\n    lat: Number(hit.lat),\n    lng: Number(hit.lon),\n    label: hit.display_name as string,\n    address: hit.address || {},\n  };\n}'''
          new='''async function nominatimSearch(q: string, acceptLang: string) {\n  try {\n    const url = `${NOMINATIM}/search?format=jsonv2&limit=1&addressdetails=1&q=${encodeURIComponent(q)}`;\n    const r = await fetch(url, { headers: { 'User-Agent': UA, 'Accept-Language': acceptLang }, signal: AbortSignal.timeout(8000) });\n    if (!r.ok) return null;\n    const data = (await r.json()) as any[];\n    const hit = data?.[0];\n    if (!hit) return null;\n    return { lat: Number(hit.lat), lng: Number(hit.lon), label: hit.display_name as string, address: hit.address || {} };\n  } catch {\n    return null;\n  }\n}'''
          if old not in s: raise SystemExit('nominatimSearch block not found')
          s=s.replace(old,new,1)

          old='''async function photonSearch(q: string) {\n  const url = `${PHOTON}/api/?limit=1&q=${encodeURIComponent(q)}`;\n  const r = await fetch(url, { headers: { 'User-Agent': UA } });\n  if (!r.ok) return null;\n  const data = (await r.json()) as any;\n  const hit = data?.features?.[0];\n  if (!hit?.geometry?.coordinates) return null;\n  const [lng, lat] = hit.geometry.coordinates;\n  const props = hit.properties || {};\n  return {\n    lat: Number(lat),\n    lng: Number(lng),\n    label: [props.name, props.city, props.country].filter(Boolean).join(', ') || q,\n    address: {\n      country: props.country,\n      country_code: props.countrycode,\n      city: props.city || props.name,\n    },\n  };\n}'''
          new='''async function photonSearch(q: string) {\n  try {\n    const url = `${PHOTON}/api/?limit=1&q=${encodeURIComponent(q)}`;\n    const r = await fetch(url, { headers: { 'User-Agent': UA }, signal: AbortSignal.timeout(8000) });\n    if (!r.ok) return null;\n    const data = (await r.json()) as any;\n    const hit = data?.features?.[0];\n    if (!hit?.geometry?.coordinates) return null;\n    const [lng, lat] = hit.geometry.coordinates;\n    const props = hit.properties || {};\n    return { lat: Number(lat), lng: Number(lng), label: [props.name, props.city, props.country].filter(Boolean).join(', ') || q, address: { country: props.country, country_code: props.countrycode, city: props.city || props.name } };\n  } catch {\n    return null;\n  }\n}'''
          if old not in s: raise SystemExit('photonSearch block not found')
          s=s.replace(old,new,1)

          old='''async function nominatimReverse(lat: number, lng: number, acceptLang: string) {\n  const url = `${NOMINATIM}/reverse?format=jsonv2&zoom=12&addressdetails=1&lat=${lat}&lon=${lng}`;\n  const r = await fetch(url, { headers: { 'User-Agent': UA, 'Accept-Language': acceptLang } });\n  if (!r.ok) return null;\n  const hit = (await r.json()) as any;\n  if (!hit || hit.error) return null;\n  return {\n    label: hit.display_name as string,\n    address: hit.address || {},\n  };\n}'''
          new='''async function nominatimReverse(lat: number, lng: number, acceptLang: string) {\n  try {\n    const url = `${NOMINATIM}/reverse?format=jsonv2&zoom=12&addressdetails=1&lat=${lat}&lon=${lng}`;\n    const r = await fetch(url, { headers: { 'User-Agent': UA, 'Accept-Language': acceptLang }, signal: AbortSignal.timeout(8000) });\n    if (!r.ok) return null;\n    const hit = (await r.json()) as any;\n    if (!hit || hit.error) return null;\n    return { label: hit.display_name as string, address: hit.address || {} };\n  } catch {\n    return null;\n  }\n}'''
          if old not in s: raise SystemExit('nominatimReverse block not found')
          s=s.replace(old,new,1)

          s=s.replace('[out:json][timeout:22];','[out:json][timeout:8];',1)
          s=s.replace("signal: AbortSignal.timeout(14000),","signal: AbortSignal.timeout(8000),",1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm install
          npm run lint
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/geo.ts .github/workflows/patch-resource-lookup.yml
          git commit -m "fix: make resource geocoding resilient to provider failures"
          git rm .github/workflows/patch-resource-lookup.yml
          git commit -m "chore: remove temporary resource patch workflow"
          git push