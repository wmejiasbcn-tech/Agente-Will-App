name: Patch resource search standard v2
on:
  push:
    branches: [fix/resources-lookup-resilience]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply resource standard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('api/geo.ts'); s=p.read_text()

          # Strict relevance/exclusion: no generic podiatry, dental, veterinary, maternity, etc.
          start=s.index('function classify('); end=s.index('\nfunction rejectSite', start)
          classify='''function classify(tags: Record<string, string> | undefined): { kind: string; category: ResourceCategory } {\n  const a = (tags?.amenity || tags?.healthcare || tags?.office || '').toLowerCase();\n  const spec = `${tags?.['healthcare:speciality'] || ''} ${tags?.healthcare || ''} ${tags?.social_facility || ''}`.toLowerCase();\n  const text = `${tags?.name || ''} ${tags?.description || ''} ${tags?.['healthcare:speciality'] || ''} ${tags?.social_facility || ''}`.toLowerCase();\n  const theme = isWillThemeName(tags?.name || '') || /hiv|vih|sida|sexual|sexolog|its|sti|prep|pep|lgbt|lgbti|gay|trans|chemsex|slam|drug|addict|substance|harm reduction|reducción de riesgos|reducción de daños|salud sexual|sexual health/.test(text);\n  if (/podiatr|podolog|foot care|dental|dentist|veterin|maternity|obstetric|orthop|optom|ophthalm|physiotherap|physio/.test(text) && !theme) return { kind: 'Fuera de ámbito', category: 'other' };\n  if (a === 'hospital' || tags?.healthcare === 'hospital') return { kind: 'Centro hospitalario', category: 'emergency' };\n  if (a === 'ngo' || a === 'association' || a === 'charity' || tags?.office === 'ngo') return { kind: 'ONG / recurso comunitario', category: 'community' };\n  if (a === 'community_centre' || a === 'social_centre') return { kind: 'Centro comunitario / sociosanitario', category: 'community' };\n  if (/drug_addiction|mental_health/.test(spec)) return { kind: 'Centro sociosanitario', category: 'community' };\n  if (a === 'clinic' || a === 'doctors' || a === 'doctor' || a === 'health_centre' || tags?.healthcare === 'clinic' || tags?.healthcare === 'centre' || tags?.healthcare === 'center') return { kind: 'Centro sanitario', category: 'health' };\n  return { kind: 'Otro recurso', category: 'other' };\n}'''
          s=s[:start]+classify+s[end:]

          start=s.index('function rejectSite('); end=s.index('\nfunction phoneFrom', start)
          reject='''function rejectSite(tags: Record<string, string>, name: string) {\n  const text = `${name} ${tags.description || ''} ${tags['healthcare:speciality'] || ''} ${tags.healthcare || ''} ${tags.social_facility || ''}`.toLowerCase();\n  const a = (tags.amenity || tags.healthcare || tags.office || '').toLowerCase();\n  if (['pharmacy','dentist','veterinary','library','theatre','townhall'].includes(a)) return true;\n  if (isCivicOrCulturalName(name)) return true;\n  if (/podiatr|podolog|foot care|dental|dentist|veterin|maternity|obstetric|orthop|optom|ophthalm|physiotherap|physio/.test(text) && !isWillThemeName(name)) return true;\n  if ((a === 'ngo' || a === 'association' || a === 'charity' || tags.office === 'ngo') && !isWillThemeName(name)) {\n    if (!/hiv|vih|sida|sexual|sexolog|its|sti|prep|pep|lgbt|lgbti|chemsex|slam|drug|addict|substance|harm|salud sexual|sexual health|health/.test(text)) return true;\n  }\n  return false;\n}'''
          s=s[:start]+reject+s[end:]

          start=s.index('function rankSite('); end=s.index('\nfunction mixSites', start)
          rank='''function rankSite(site: Site) {\n  if (site.kind.includes('ONG') || site.kind.includes('comunitario')) return 0;\n  if (site.kind.includes('sociosanitario')) return 1;\n  if (site.kind.includes('sanitario')) return 2;\n  if (site.kind.includes('hospitalario')) return 3;\n  return 4;\n}'''
          s=s[:start]+rank+s[end:]

          start=s.index('function mixSites('); end=s.index('\nasync function overpassNearby', start)
          mix='''function mixSites(sites: Site[]) {\n  return [...sites].sort((a, b) => rankSite(a) - rankSite(b) || a.km - b.km).slice(0, 100);\n}\n'''
          s=s[:start]+mix+s[end:]

          s=s.replace('out center 100;', 'out center 500;')
          s=s.replace("const queries = ['ONG VIH', 'HIV NGO', 'sexual health', 'LGBT health', 'hospital', 'clinic'];", "const queries = ['ONG VIH', 'HIV NGO', 'sexual health', 'LGBT health', 'LGBT community', 'STI clinic', 'sexual medicine', 'PrEP', 'harm reduction', 'drug addiction', 'chemsex', 'SLAM', 'hospital', 'clinic', 'community health'];")
          p.write_text(s)

          p=Path('src/components/OtherResourcesView.tsx'); s=p.read_text()
          s=s.replace('Buscar ciudad, región, país o un lugar concreto','Buscar recursos por ciudad, región, país o lugar')
          marker='''        <div className="flex flex-wrap gap-2">'''
          text='''        <p className="text-[11px] will-copy-muted leading-relaxed">\n          Orden de búsqueda: centros comunitarios y ONG especializadas → centros sociosanitarios especializados → centros sanitarios especializados → centros hospitalarios. Se excluyen servicios sin relación con los temas de Will.\n        </p>\n\n'''
          s=s.replace(marker,text+marker,1)
          s=s.replace('No hemos encontrado resultados para esta búsqueda.','No hemos encontrado recursos relacionados con los temas de Will en esta búsqueda. Puedes probar con otra ciudad o una búsqueda más concreta.')
          p.write_text(s)

          Path('docs/RESOURCE_SEARCH_STANDARD_WILL_v1.0.md').write_text('''# ESTÁNDAR DE BÚSQUEDA DE RECURSOS WILL v1.0\n\n## Orden obligatorio\n1. Centros comunitarios y ONG especializadas.\n2. Centros sociosanitarios especializados.\n3. Centros sanitarios especializados.\n4. Centros hospitalarios.\n\nDentro de cada nivel: pertinencia temática y especificidad → proximidad.\n\n## Regla de pertinencia\nLa proximidad por sí sola nunca convierte un establecimiento en recurso de Will. Debe existir un indicio en nombre, descripción, especialidad o clasificación de relación con salud sexual, VIH/ITS, PrEP/PEP, sexualidad, LGBT/LGBTI, sustancias, adicciones, Chemsex, SLAM, reducción de riesgos/daños o apoyo comunitario relacionado.\n\n## Exclusiones\nFarmacias, odontología, veterinaria, podología, maternidad, ortopedia, optometría, oftalmología, fisioterapia y otros servicios no relacionados se excluyen.\n\n## Cobertura y límites\nLa búsqueda admite ciudad, región, país o lugar y es independiente del país. OSM/Overpass no permite afirmar que se hayan encontrado literalmente todos los recursos existentes; Will no inventará resultados ni presentará una ausencia de datos como inexistencia.\n''')
          PY
      - name: Validate
        run: npm install && npm run lint && npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/geo.ts src/components/OtherResourcesView.tsx docs/RESOURCE_SEARCH_STANDARD_WILL_v1.0.md .github/workflows/patch-resource-standard-v2.yml
          git commit -m "feat: standardize Will resource search and relevance"
          git rm .github/workflows/patch-resource-standard-v2.yml
          git commit -m "chore: remove temporary resource standard workflow"
          git push