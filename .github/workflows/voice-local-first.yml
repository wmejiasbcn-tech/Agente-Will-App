name: Apply voice local-first
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'wmejiasbcn-tech' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make local voice endpoint first
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/WillVoice.tsx')
          s = p.read_text()
          old = "  return [PUBLISHED_SPEAK, '/api/voice/speak'];"
          new = "  return ['/api/voice/speak', PUBLISHED_SPEAK];"
          if old not in s:
              raise SystemExit('expected speakUrls line not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WillVoice.tsx
          git rm .github/workflows/voice-local-first.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(voice): prefer local speech endpoint"
          git push
