name: Patch resource search standard
on:
  push:
    branches: [fix/resources-lookup-resilience]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply resource search standard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('api/geo.ts'); s=p.read_text()
          # Expand Site with searchable relevance fields.
          s=s.replace("  audience?: string;\n};", "  audience?: string;\n  relevance: number;\n};")

          # Replace classification with strict Will-topic relevance and explicit hierarchy.
          start=s.index('function classify('); end=s.index('\nfunction rejectSite', start)
          new='''function classify(tags: Record<string, string> | undefined): {\n  kind: string;\n  category: ResourceCategory;\n  relevance: number;\n} {\n  const a = (tags?.amenity || tags?.healthcare || tags?.office || '').toLowerCase();\n  const spec = `${tags?.['healthcare:speciality'] || ''} ${tags?.healthcare || ''} ${tags?.social_facility || ''}`.toLowerCase();\n  const text = `${tags?.name || ''} ${tags?.description || ''} ${tags?.['healthcare:speciality'] || ''} ${tags?.social_facility || ''}`.toLowerCase();\n  const theme = isWillThemeName(tags?.name || '') || /hiv|vih|sida|sexual|sexolog|its|sti|prep|pep|lgbt|lgbti|gay|trans|chemsex|slam|drug|addict|substance|harm reduction|reducción de riesgos|reducción de daños|salud sexual|sexual health/.test(text);\n  if (/podiatr|podolog|foot|pie|dental|dentist|veterin|maternity|obstetric|orthop|optom|ophthalm|physiotherap|physio/.test(text) && !theme) {\n    return { kind: 'Fuera de ámbito', category: 'other', relevance: -100 };\n  }\n  if (a === 'hospital' || tags?.healthcare === 'hospital') return { kind: 'Centro hospitalario', category: 'emergency', relevance: theme ? 70 : 20 };\n  if (a === 'ngo' || a === 'association' || a === 'charity' || tags?.office === 'ngo') return { kind: 'ONG / recurso comunitario', category: 'community', relevance: theme ? 100 : 35 };\n  if (a === 'community_centre' || a === 'social_centre' || tags?.social_facility) return { kind: 'Centro comunitario / sociosanitario', category: 'community', relevance: theme ? 95 : 30 };\n  if (/drug_addiction|mental_health/.test(spec)) return { kind: 'Centro sociosanitario', category: 'community', relevance: theme ? 95 : 40 };\n  if (a === 'clinic' || a === 'doctors' || a === 'doctor' || a === 'health_centre' || tags?.healthcare === 'clinic' || tags?.healthcare === 'centre' || tags?.healthcare === 'center') return { kind: 'Centro sanitario', category: 'health', relevance: theme ? 90 : 25 };\n  return { kind: 'Otro recurso', category: 'other', relevance: theme ? 60 : -10 };\n}'''
          s=s[:start]+new+s[end:]

          # Strict rejection: irrelevant providers never reach cards.
          start=s.index('function rejectSite('); end=s.index('\nfunction phoneFrom', start)
          new='''function rejectSite(tags: Record<string, string>, name: string) {\n  const text = `${name} ${tags.description || ''} ${tags['healthcare:speciality'] || ''} ${tags.healthcare || ''} ${tags.social_facility || ''}`.toLowerCase();\n  const a = (tags.amenity || tags.healthcare || tags.office || '').toLowerCase();\n  if (['pharmacy','dentist','veterinary','library','theatre','townhall'].includes(a)) return true;\n  if (isCivicOrCulturalName(name)) return true;\n  if (/podiatr|podolog|foot care|dental|dentist|veterin|maternity|obstetric|orthop|optom|ophthalm|physiotherap|physio/.test(text) && !isWillThemeName(name)) return true;\n  if ((a === 'ngo' || a === 'association' || a === 'charity' || tags.office === 'ngo') && !isWillThemeName(name)) {\n    if (!/hiv|vih|sida|sexual|sexolog|its|sti|prep|pep|lgbt|lgbti|chemsex|slam|drug|addict|substance|harm|salud sexual|sexual health|health/.test(text)) return true;\n  }\n  return false;\n}'''
          s=s[:start]+new+s[end:]

          # Update toSite to retain relevance and reject non-Will services.
          s=s.replace("  const { kind, category } = classify(tags);", "  const { kind, category, relevance } = classify(tags);")
          s=s.replace("  if (kind === 'Fuera de ámbito' || kind === 'Farmacia') return null;", "  if (kind === 'Fuera de ámbito' || relevance < 0) return null;")
          s=s.replace("    maternity: isMaternityName(name),\n  };", "    maternity: isMaternityName(name),\n    relevance,\n  };")

          # Rank by thematic relevance first, then the mandated hierarchy, then distance.
          start=s.index('function rankSite('); end=s.index('\nfunction mixSites', start)
          new='''function rankSite(site: Site) {\n  if (site.kind.includes('ONG') || site.kind.includes('comunitario')) return 0;\n  if (site.kind.includes('sociosanitario')) return 1;\n  if (site.kind.includes('sanitario')) return 2;\n  if (site.kind.includes('hospitalario')) return 3;\n  return 4;\n}'''
          s=s[:start]+new+s[end:]

          # Do not truncate the first page to an arbitrary mixed 12/6/4/2 distribution.\n          start=s.index('function mixSites('); end=s.index('\nasync function overpassNearby', start)
          new='''function mixSites(sites: Site[]) {\n  return [...sites].sort((a, b) => rankSite(a) - rankSite(b) || b.relevance - a.relevance || a.km - b.km).slice(0, 100);\n}\n'''
          s=s[:start]+new+s[end:]

          # Query broad but Will-specific OSM signals and allow up to 500 elements.\n          s=s.replace('out center 100;', 'out center 500;')
          old='''  const queries = ['ONG VIH', 'HIV NGO', 'sexual health', 'LGBT health', 'hospital', 'clinic'];'''
          new="""  const queries = [\n    'ONG VIH', 'HIV NGO', 'sexual health', 'LGBT health', 'LGBT community',\n    'STI clinic', 'sexual medicine', 'PrEP', 'harm reduction', 'drug addiction',\n    'chemsex', 'SLAM', 'hospital', 'clinic', 'community health',\n  ];"""
          s=s.replace(old,new)
          p.write_text(s)

          # UI: make the search explicit as a resource search and expose the standard order.
          p=Path('src/components/OtherResourcesView.tsx'); s=p.read_text()
          s=s.replace('Buscar ciudad, región, país o un lugar concreto','Buscar recursos por ciudad, región, país o lugar')
          s=s.replace('placeholder="Ciudad, región, país o lugar"','placeholder="Ciudad, región, país o lugar"')
          needle='''        <div className="flex flex-wrap gap-2">'''
          insert='''        <p className="text-[11px] will-copy-muted leading-relaxed">\n          Orden de búsqueda: centros comunitarios y ONG especializadas → centros sociosanitarios especializados → centros sanitarios especializados → centros hospitalarios. Se descartan servicios sin relación con los temas de Will.\n        </p>\n\n'''
          s=s.replace(needle,insert+needle,1)
          s=s.replace('No hemos encontrado resultados para esta búsqueda.','No hemos encontrado recursos relacionados con los temas de Will en esta búsqueda. Puedes probar con otra ciudad o una búsqueda más concreta.')
          p.write_text(s)

          # Add canonical protocol documentation in this product repository.
          p=Path('docs/RESOURCE_SEARCH_STANDARD_WILL_v1.0.md')
          p.write_text('''# ESTÁNDAR DE BÚSQUEDA DE RECURSOS WILL v1.0\n\n## Principio\nLa búsqueda de Recursos de Apoyo no devuelve establecimientos sanitarios genéricos por proximidad. Busca recursos relacionados con los ámbitos de Will y los presenta por pertinencia temática y jerarquía de atención.\n\n## Orden obligatorio\n1. Centros comunitarios y ONG especializadas.\n2. Centros sociosanitarios especializados.\n3. Centros sanitarios especializados.\n4. Centros hospitalarios.\n\nDentro de cada nivel: pertinencia temática → especificidad del recurso → proximidad.\n\n## Exclusión\nNo se muestran farmacias, odontología, veterinaria, podología, maternidad, ortopedia, fisioterapia u otros servicios sin indicio de relación con los temas de Will. Un hospital genérico no desplaza a un recurso comunitario especializado.\n\n## Cobertura\nLa consulta acepta ciudad, región, país o lugar y debe funcionar con independencia del país. La fuente OSM/Overpass no permite afirmar que se hayan encontrado literalmente «todos» los recursos existentes en una ciudad; el producto debe presentar los recursos encontrados por las fuentes disponibles sin inventar ni confundir ausencia de resultado con inexistencia.\n\n## Temática\nLa pertinencia considera salud sexual, VIH/ITS, PrEP/PEP, sexualidad, LGBT/LGBTI, consumo de sustancias, adicciones, Chemsex, SLAM, reducción de riesgos y daños y recursos comunitarios relacionados.\n\n## Regla de no contaminación\nUn recurso solo entra en la lista si existe indicio en sus datos de relación con los temas de Will. La proximidad geográfica por sí sola no es criterio suficiente.\n''')
          PY
      - name: Validate
        run: npm install && npm run lint && npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/geo.ts src/components/OtherResourcesView.tsx docs/RESOURCE_SEARCH_STANDARD_WILL_v1.0.md .github/workflows/patch-resource-standard.yml
          git commit -m "feat: standardize Will resource search and ranking"
          git rm .github/workflows/patch-resource-standard.yml
          git commit -m "chore: remove temporary resource standard workflow"
          git push