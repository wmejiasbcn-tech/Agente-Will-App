name: Apply P0 runtime instruction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace runtime instruction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('api/app.ts')
          source = app.read_text(encoding='utf-8')
          instruction = Path('docs/P0_RUNTIME_SYSTEM_INSTRUCTION.txt').read_text(encoding='utf-8').rstrip()
          replacement = 'const WAIPL_SYSTEM_INSTRUCTION = `\\n' + instruction + '\\n`;'
          pattern = r'const WAIPL_SYSTEM_INSTRUCTION = `.*?`;'
          updated, count = re.subn(pattern, lambda _: replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one WAIPL_SYSTEM_INSTRUCTION block, found {count}')
          app.write_text(updated, encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -n "PRINCIPIO CONSTITUCIONAL DE SOBERANÍA" api/app.ts
          grep -n "RRRR + RRDD" api/app.ts
          grep -n "TRANSFERENCIA DE DECISIÓN" api/app.ts
          if grep -q "Para Will, no directividad no significa sonar amable mientras conduces" api/app.ts; then
            echo "Legacy constitutional instruction still present"
            exit 1
          fi
          git diff --check

      - name: Commit runtime change
        run: |
          if git diff --quiet -- api/app.ts; then
            echo "No runtime change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/app.ts
          git commit -m "feat: apply WAIPL interaction paradigm to runtime"
          git push
