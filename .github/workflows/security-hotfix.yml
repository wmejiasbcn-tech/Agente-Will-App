name: Apply security hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply security fixes
        shell: python
        run: |
          from pathlib import Path
          import json

          app = Path('api/app.ts')
          text = app.read_text(encoding='utf-8')

          text = text.replace(
              'import express from "express";\n',
              'import express from "express";\nimport { rateLimit } from "express-rate-limit";\n',
              1,
          )
          text = text.replace(
              'const app = express();\napp.use(express.json({ limit: "12mb" }));',
              '''const app = express();

const apiLimiter = rateLimit({
  windowMs: 15 * 60 * 1000,
  limit: 120,
  standardHeaders: "draft-8",
  legacyHeaders: false,
  message: { error: "Too many requests. Please try again later." },
});

app.use(apiLimiter);
app.use(express.json({ limit: "12mb" }));''',
              1,
          )
          old = '''    if (contextDimension && contextDimension !== "all") {
      systemInstruction += `\\n[Nota: Dimensión P.R.E.S.E.N.T.E. activa: ${contextDimension}. No fuerces al usuario.]`;
    }
'''
          if old not in text:
              raise SystemExit('Expected contextDimension block not found')
          text = text.replace(old, '', 1)
          app.write_text(text, encoding='utf-8')

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          deps = data.setdefault('dependencies', {})
          deps['express-rate-limit'] = '^8.7.0'
          pkg.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          if 'permissions:\n  contents: read\n' not in ci_text:
              marker = '  pull_request:\n    branches: [main]\n\n'
              if marker not in ci_text:
                  raise SystemExit('Expected CI trigger block not found')
              ci_text = ci_text.replace(marker, marker + 'permissions:\n  contents: read\n\n', 1)
              ci.write_text(ci_text, encoding='utf-8')

      - name: Verify source changes
        run: |
          grep -n 'express-rate-limit' api/app.ts package.json
          grep -n 'apiLimiter' api/app.ts
          ! grep -n 'Dimensión P.R.E.S.E.N.T.E. activa: ${contextDimension}' api/app.ts
          grep -n -A1 '^permissions:' .github/workflows/ci.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/app.ts package.json .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(security): close CodeQL findings for prompt injection and rate limiting'
          git push
