name: Fix CodeQL prompt flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'wmejiasbcn-tech' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove request-derived context from system prompt
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/app.ts')
          s = p.read_text()
          start = '    if (detectedContext?.type) {'
          end = '\n\n    let text = "";'
          a = s.find(start)
          b = s.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit('context block markers not found')
          s = s[:a] + s[b + 2:]
          p.write_text(s)
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/app.ts
          git rm .github/workflows/fix-codeql-prompt.yml
          git commit -m "fix(security): remove request-derived context from system prompt"
          git push
